name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libmagic1
      - run: pip install -e ".[dev]"
      - run: pytest --cov=pandora_box --cov-report=term-missing

  e2e:
    name: End-to-end tests (loop device)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Load kernel modules
        run: |
          # exfat is shipped in the extra modules package on the Azure kernel
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          sudo modprobe -a loop vfat exfat ext4 fuse
      - name: Run tests in a privileged container (real clamd, YARA-X, hash engines)
        run: tests/e2e/run.sh

  airgap:
    name: Copy to real servers (rsync over SSH, SFTP, SMB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run tests against an OpenSSH and a Samba server in containers
        run: tests/airgap/run.sh

  image:
    name: Kiosk image (end-to-end test in a QEMU/KVM virtual machine)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
      - name: Allow the runner to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the test image
        run: image/build-test.sh
      - name: Run the end-to-end test
        run: image/vm.sh test --workdir vm-test
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: vm-test
          path: vm-test/

  build:
    name: Package build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
