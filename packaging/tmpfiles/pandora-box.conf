# Mount point of the scanned USB device (device.mount_point)
d /media/pandora-box 0700 root root -
# Signed signature sets, read by clamd and the scan workers
d /var/lib/pandora-box-signatures 0755 root root -
# Image updates staged for systemd-sysupdate
d /var/lib/pandora-box-image 0755 root root -
