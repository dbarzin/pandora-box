# User of the sandboxed scan workers (scan.sandbox_user): no home, no shell
u pandora-box-scan - "PandoraBox scan workers" / /usr/sbin/nologin
# User of the online signature updates (pandora-box-update.service): the
# firewall of an online kiosk lets it out
u pandora-box-update - "PandoraBox online updates" / /usr/sbin/nologin
# Readers of the log file of the kiosk (group of /var/log/pandora-box)
g pandora-box-log -
# User of the log export to a SIEM (pandora-box-siem.service): the firewall
# of an online kiosk lets it out too; it reads the log file of the kiosk
u pandora-box-siem - "PandoraBox log export to a SIEM" / /usr/sbin/nologin
m pandora-box-siem pandora-box-log
# User of the copy of the verified keys to a server (pandora-box-airgap.service):
# the firewall of an online kiosk lets it out
u pandora-box-airgap - "PandoraBox copy to a server" / /usr/sbin/nologin
