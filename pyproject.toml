[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pandora-box"
version = "0.1.0.dev0"
description = "Open source USB decontamination kiosk to detect and remove malware from USB storage devices"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Didier Barzin" }]
requires-python = ">=3.11"
keywords = ["usb", "malware", "antivirus", "kiosk", "sheep-dip", "security"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console :: Curses",
    "Environment :: Console :: Framebuffer",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "paramiko>=3.4",  # copy to an SFTP server (airgap)
    "pillow>=10.1",
    "pyudev>=0.24",
    "python-magic>=0.4.24",
    "smbprotocol>=1.13",  # copy to an SMB server (airgap)
    "yara-x>=1.0",
]

[project.optional-dependencies]
dev = [
    "flor>=1.1.3",  # reference DCSO Bloom filter implementation, tests only
    "jsonschema>=4.0",  # validation of the scan reports, tests only
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
pandora-box = "pandora_box.cli:main"
pandora-box-signatures = "pandora_box.sigsets:main"
pandora-box-image = "pandora_box.imageupdate:main"
pandora-box-theme = "pandora_box.ui.preview:main"
pandora-box-siem = "pandora_box.siem:main"
pandora-box-airgap = "pandora_box.airgap:main"

[project.urls]
Homepage = "https://github.com/sourcentis/pandora-box"
Issues = "https://github.com/sourcentis/pandora-box/issues"
Security = "https://github.com/sourcentis/pandora-box/security/policy"

[tool.hatch.build.targets.sdist]
exclude = ["/3D", "/.github"]

[tool.hatch.build.targets.wheel]
packages = ["src/pandora_box"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "image/vm"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "PTH",  # prefer pathlib
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S324", "S603", "S607"]  # asserts, test hashes and commands
"image/vm/**" = ["S101", "S324", "S603", "S607"]
"src/pandora_box/ui/curses_display.py" = ["E501"]  # the PandoraBox logo

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests", "image/vm"]

[[tool.mypy.overrides]]
module = ["pyudev", "pyudev.*", "flor", "jsonschema", "paramiko", "paramiko.*", "smbclient", "smbprotocol.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not e2e and not airgap"]
markers = [
    "e2e: end-to-end tests with a loop device (need root, see tests/e2e/run.sh)",
    "airgap: copy to real rsync, SFTP and SMB servers (see tests/airgap/run.sh)",
    "integration: tests with real engines or signatures, skipped when unavailable",
]
