# Test profile, for the virtual machine tests only (image/vm/): test-only
# signatures that detect the corpus of image/vm/corpus.py, and a root shell
# without password on the virtio console (hvc0). Never deploy it on a kiosk.
# It includes the profile "online": the test updates the signatures online.

[Include]
Include=%D/mkosi.profiles/online

[Output]
Output=pandora-box-test

[Content]
# The production image has no login program: no interactive session at all
Packages=login
# Security assessment of the image (image/vm/run_tests.py)
Packages=lynis
Autologin=yes
# Kernel messages and the journal on the serial port (the test logs), to
# understand a boot that fails
KernelCommandLine=console=ttyS0 systemd.journald.forward_to_console=1
# A version that cannot find its root filesystem fails its boot try faster
KernelCommandLine=systemd.default_device_timeout_sec=30
ExtraTrees=%D/mkosi.profiles/test/mkosi.extra
PostInstallationScripts=%D/mkosi.profiles/test/postinst.chroot
