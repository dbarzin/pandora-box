#!/usr/sbin/nft -f
# Firewall of an online kiosk (image profile "online"): nothing comes in but
# the answers to its own connections, and only the online signature updates
# go out (their server, or their proxy), with DHCP and DNS.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        iif lo accept
        ct state established,related accept
        # DHCP answers
        udp sport 67 udp dport 68 accept
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
    }
    chain output {
        type filter hook output priority filter; policy drop;
        oif lo accept
        ct state established,related accept
        # DHCP (systemd-networkd) and DNS (systemd-resolved)
        meta skuid "systemd-network" udp sport 68 udp dport 67 accept
        meta skuid "systemd-resolve" udp dport 53 accept
        meta skuid "systemd-resolve" tcp dport 53 accept
        # Online signature updates (pandora-box-update.service)
        meta skuid "pandora-box-update" meta l4proto tcp accept
    }
}
