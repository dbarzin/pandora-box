# Time synchronization of an online kiosk (docs/build.md). systemd-timesyncd
# uses, in this order: the servers of NTP= below, those given by DHCP (UseNTP=
# of 80-pandora-box-ethernet.network), then those of FallbackNTP=. Only
# systemd-timesyncd may send NTP requests (UDP 123) through the firewall.
[Time]
# The NTP servers of the organization, separated by spaces, e.g.
# NTP=ntp1.example.org ntp2.example.org
NTP=
# Without servers from NTP= nor from DHCP: the Debian pool
FallbackNTP=0.debian.pool.ntp.org 1.debian.pool.ntp.org 2.debian.pool.ntp.org 3.debian.pool.ntp.org
