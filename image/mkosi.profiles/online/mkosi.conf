# Online signature updates (docs/signatures.md): DHCP on Ethernet, DNS, and a
# firewall that only lets the update service and the log export to a SIEM
# (docs/siem.md, when [siem] is enabled) out. The kiosk downloads the
# signatures from their sources ([updates] of its configuration, written by
# postinst.chroot), with the credentials of image/credentials.toml.

[Content]
Packages=systemd-resolved
# Time of the kiosk (timestamps of the logs and reports, validity of the
# certificates of the update servers and of the SIEM): NTP servers given by
# DHCP, else those of timesyncd.conf.d/50-pandora-box.conf
Packages=systemd-timesyncd
# The update service updates the ClamAV databases with freshclam (its own
# services are disabled)
Packages=clamav-freshclam
ExtraTrees=%D/mkosi.profiles/online/mkosi.extra
PostInstallationScripts=%D/mkosi.profiles/online/postinst.chroot
