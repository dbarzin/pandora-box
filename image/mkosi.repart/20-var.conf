# Variable data (reports, quarantine, logs, signatures), mounted on /var by
# /etc/fstab. It is the last partition: systemd-repart grows it at boot to
# fill the disk (/usr/lib/repart.d/20-var.conf), then systemd-growfs grows
# the filesystem.
[Partition]
Type=var
Label=pandora-box-data
# Kept by updates: never part of an update
SplitName=-
Format=ext4
CopyFiles=/var:/
SizeMinBytes=1G
