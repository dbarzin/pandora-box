# Read-only root filesystem, slot A: the whole system but /var, protected by
# dm-verity. Its root hash is in the kernel command line of the signed
# unified kernel image (UKI): a modified block cannot be read. The label
# holds the image version (systemd-sysupdate). Fixed size: the next versions
# are written in the same slots (A/B updates).
[Partition]
Type=root
Label=pandora-box_%A
Format=erofs
CopyFiles=/
ExcludeFilesTarget=/var/
SizeMinBytes=1G
SizeMaxBytes=1G
Verity=data
VerityMatchKey=root
