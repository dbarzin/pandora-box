# USB-Pasteur kiosk image (phase 2). Build it with image/build.sh, which runs
# mkosi in a Debian 13 container: see docs/image.md.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
Format=disk
ImageId=usb-pasteur
Output=usb-pasteur
CompressOutput=no
ManifestFormat=json
# The partitions of slot A and the UKI make an image update (A/B)
SplitArtifacts=uki,partitions

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
# Versioned UKI name (systemd-sysupdate): EFI/Linux/usb-pasteur_<version>.efi
UnifiedKernelImageFormat=usb-pasteur_%v
# No USB device is authorized until USBGuard has applied its policy
KernelCommandLine=ro usbcore.authorized_default=0
# The kiosk owns the first console: kernel and boot messages go to the second
# one, never shown (they are in the journal)
KernelCommandLine=console=tty2 quiet loglevel=3 systemd.show_status=no
# A kernel panic restarts the kiosk; a failure in the initrd too (its
# emergency shell restarts, mkosi.images/initrd/): a new image version that
# does not boot goes back to the previous one
KernelCommandLine=panic=10
# Audit every process, also those started before auditd
KernelCommandLine=audit=1 audit_backlog_limit=8192
# The screen of the reference hardware, Waveshare 7 inch HDMI LCD (1024x600):
# the firmware of the ThinkCentre starts in 1024x768 and the graphics driver
# keeps it, so that the bottom of the kiosk is off the screen. CVT timings,
# as Waveshare documents them. Another screen: remove this line.
KernelCommandLine=video=1024x600M@60
# The initrd of the image (mkosi.images/initrd/)
Initrds=%O/initrd
# Kernel hardening (ANSSI recommendations): memory initialization and
# randomization, no legacy vsyscall, no debugfs, lockdown in confidentiality
# mode (Secure Boot only enables integrity), IOMMU against DMA attacks
KernelCommandLine=slab_nomerge init_on_alloc=1 init_on_free=1 page_alloc.shuffle=1
                  randomize_kstack_offset=on vsyscall=none debugfs=off
                  lockdown=confidentiality
                  intel_iommu=on iommu.strict=1 iommu.passthrough=0 efi=disable_early_pci_dma
Hostname=usb-pasteur
Locale=C.UTF-8
Timezone=Etc/UTC
WithDocs=no
CleanPackageMetadata=yes

# No driver for USB network adapters, wireless, Bluetooth, USB serial adapters
# and modems: such devices are not even usable when plugged in. Staging
# drivers and batman-adv are excluded too: they would bring the wireless
# modules back as dependencies. USB HID is kept for the touchscreen;
# keyboards and mice are blocked by USBGuard.
KernelModulesExclude=
    # Network protocols the kiosk never uses (lynis NETW-3200)
    net/dccp/
    net/sctp/
    net/rds/
    net/tipc/
    # FireWire, another way into the memory and storage of the kiosk (with
    # the sound, video and storage target drivers that depend on it)
    /firewire/
    drivers/target/sbp/
    drivers/net/usb/
    drivers/net/wireless/
    net/wireless/
    net/mac80211/
    drivers/bluetooth/
    net/bluetooth/
    drivers/usb/serial/
    drivers/usb/class/cdc-acm
    drivers/staging/
    net/batman-adv/
# The initrd only needs to find and mount the root filesystem: disk
# controllers (NVMe, SATA, Intel VMD, eMMC, virtio for the virtual machines),
# dm-verity and EROFS. The other modules are loaded from the root filesystem.
# (Without this, every module and its firmware: about 80 MB in the UKI.)
KernelModulesInitrdExclude=.*
KernelModulesInitrdInclude=
    /nvme.ko
    /ahci.ko
    /sd_mod.ko
    /vmd.ko
    /mmc_block.ko
    /sdhci-pci.ko
    /virtio_blk.ko
    /virtio_pci.ko
    /virtio_scsi.ko
    /dm-mod.ko
    /dm-verity.ko
    /erofs.ko
    # Loaded by name, not as a dependency: the superblock checksum of EROFS
    /crc32c
    /efivarfs.ko
    /autofs4.ko

# The repository (one level up) is mounted at /work/src/usb-pasteur
BuildSources=..:usb-pasteur

Packages=
    linux-image-amd64
    systemd
    systemd-sysv
    systemd-boot-efi
    systemd-boot
    systemd-container
    systemd-repart
    udev
    kmod
    util-linux
    mount
    e2fsprogs
    eject
    python3
    python3-venv
    libmagic1
    # Font of the graphical interface
    fonts-dejavu-core
    clamav-daemon
    usbguard
    bubblewrap
    nftables
    auditd

# The kernel package installs the kernel, its configuration and its symbols
# in /boot, which is copied to the ESP: the UKI is built from
# /usr/lib/modules/<version>/vmlinuz, nothing boots these files
RemoveFiles=
    /boot/vmlinuz-*
    /boot/config-*
    /boot/System.map-*

# Build of the usb-pasteur wheel (mkosi.build.chroot), without network
BuildPackages=
    python3-pip
    python3-hatchling

[Validation]
# Sign systemd-boot, the UKI and the root hash. Development keys are generated
# by build.sh; release keys stay out of the repository (docs/image.md).
SecureBoot=yes
SecureBootKey=%D/mkosi.key
SecureBootCertificate=%D/mkosi.crt
Verity=yes
VerityKey=%D/mkosi.key
VerityCertificate=%D/mkosi.crt

[Config]
Dependencies=initrd

[Build]
# Reuse the installed packages between builds (cache in a Docker volume)
Incremental=yes
