# In the initrd of the kiosk, an emergency shell is useless (no root password,
# nobody at a console): restart instead. A new image version that cannot
# mount its root filesystem thus fails its boot try, and after 3 tries
# systemd-boot goes back to the previous version (A/B updates).
[Service]
ExecStartPre=
ExecStart=
ExecStart=-/usr/bin/systemctl --no-block reboot
