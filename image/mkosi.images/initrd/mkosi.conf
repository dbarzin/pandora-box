# The initrd of the image: the default initrd of mkosi, with a reboot instead
# of an emergency shell (see mkosi.extra/), without what the boot of a
# read-only root filesystem does not need

[Include]
Include=mkosi-initrd

[Content]
# mkosi-initrd removes the dpkg package, with apt warnings about removing an
# essential package: its files are removed instead (RemoveFiles=)
RemovePackages=
ExtraTrees=%D/mkosi.images/initrd/mkosi.extra
RemoveFiles=
    # udev hardware database, charset conversions, Perl (of dpkg)
    /usr/lib/udev/hwdb.bin
    /usr/lib/x86_64-linux-gnu/gconv
    /usr/bin/perl*
    /usr/lib/x86_64-linux-gnu/perl-base
    /usr/share/doc
    # dpkg
    /etc/cron.daily
    /etc/dpkg
    /etc/logrotate.d
    /usr/bin/dpkg*
    /usr/bin/update-alternatives
    /usr/lib/systemd/system/dpkg-db-backup.*
    /usr/libexec/dpkg
    /usr/sbin/start-stop-daemon
    /usr/share/dpkg
    /var/lib/dpkg
    # No network in the initrd
    /usr/lib/systemd/systemd-networkd*
    /usr/lib/systemd/system/systemd-networkd*
