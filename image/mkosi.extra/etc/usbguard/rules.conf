# USBGuard policy of the kiosk: only USB storage devices and hubs are allowed.
# Every other device is blocked (ImplicitPolicyTarget=block): keyboards,
# mice, network adapters... (BadUSB). A device with a storage interface and
# any other interface (a key that is also a keyboard) is blocked too.
# The touchscreen of the kiosk is allowed by its own rule (reference hardware).

# Hubs, including the root hubs of the USB controllers
allow with-interface equals { 09:*:* }
# USB storage only: every interface of the device is mass storage
allow with-interface equals { 08:*:* }

# Touchscreen of the reference hardware, Waveshare 7 inch HDMI LCD (C): its
# USB touch controller (eGalax), with its single generic HID interface (a
# keyboard has 03:01:01), on the internal port of the enclosure where it is
# connected, and this unit only (serial). Another unit or port: change the
# rule, as logged in /var/log/usbguard/usbguard-audit.log when it is blocked.
allow id 0eef:0005 serial "220211" name "WS170120" with-interface 03:00:00 via-port "1-8"

# A mouse instead of the touchscreen (a screen without touch): a left click
# confirms a cleaning. Allow this mouse only, with a single mouse interface
# (03:01:02, so a mouse that is also a keyboard stays blocked), on its port.
# Take its id, name, serial and port from the audit log; for example:
# allow id 046d:c077 name "USB Optical Mouse" with-interface equals { 03:01:02 } via-port "1-5"
