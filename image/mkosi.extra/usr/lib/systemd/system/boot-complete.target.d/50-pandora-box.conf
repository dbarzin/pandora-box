# Boot assessment of a new image version (A/B updates): its boot is good once
# the kiosk is ready (systemd-bless-boot then keeps the version). A boot that
# does not get there in time is restarted: after 3 tries, systemd-boot goes
# back to the previous version.
[Unit]
Requires=pandora-box.service
After=pandora-box.service
JobRunningTimeoutSec=15min
JobTimeoutAction=reboot-force
