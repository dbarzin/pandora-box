# Built-in theme of the graphical kiosk interface.
#
# A theme folder (display.theme) holds a theme.toml with the same keys and
# its own files: every key it sets replaces the built-in one, the others are
# kept. Files are relative to the folder of their theme.toml. Check a theme
# and see its screens with: pandora-box-theme preview <folder> <output>

# Logo of the organization, in the header (PNG or JPEG); "" for none
logo = ""
# TrueType fonts; "" for DejaVu Sans (Debian package fonts-dejavu-core)
font = ""
font_bold = ""
# Size of the texts: from 1 (the built-in layout) to 1.5, for readers who
# need larger texts; images and icons keep their size
text_scale = 1.0

# Every text must be readable on its background: the theme is refused when a
# contrast ratio is below the WCAG 2.1 AA level, 4.5:1 for text on
# background, 3:1 for header_text on header, threat and progress, and for
# progress on progress_background
[colors]
header = "#8b0019"
header_text = "#ffffff"
background = "#ffffff"
text = "#1e1e1e"
# Secondary text: help, versions, file details
muted = "#5f5f5f"
clean = "#2a7f39"
threat = "#c8102e"
warning = "#b35c00"
progress = "#8b0019"
progress_background = "#e4e4e4"

[images]
# Animation of the waiting screen, one image per second
insert = ["insert1.jpg", "insert2.jpg", "insert3.jpg", "insert4.jpg", "insert5.jpg"]
# Animation while the kiosk works
busy = [
    "busy1.png", "busy2.png", "busy3.png", "busy4.png", "busy5.png",
    "busy6.png", "busy7.png", "busy8.png", "busy9.png",
]
clean = "clean.png"
threat = "threat.png"
error = "error.png"

# Texts by language (display.language). Placeholders between braces are
# replaced: {done}, {total}, {count}, {size}, {used}.

