# Server of the airgap tests and the runner: see run.sh.
services:
  # The secret of the test: an SSH key of the kiosk
  keygen:
    build: {context: ../.., dockerfile: tests/airgap/Dockerfile}
    volumes: [secrets:/secrets]
    command:
      - sh
      - -c
      - >-
        rm -f /secrets/* &&
        ssh-keygen -q -t ed25519 -N "" -f /secrets/id_ed25519 &&
        chmod 0644 /secrets/*
  sshd:
    build: {context: ., dockerfile: Dockerfile.sshd}
    volumes: [secrets:/secrets, sshdata:/srv/keys]
  runner:
    build: {context: ../.., dockerfile: tests/airgap/Dockerfile}
    depends_on: [sshd]
    volumes:
      - secrets:/secrets:ro
      # The files as the server holds them, to check them
      - sshdata:/check/ssh:ro
volumes:
  secrets:
  sshdata:
