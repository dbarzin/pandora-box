# Project information
site_name: PandoraBox
site_description: Open source USB decontamination kiosk
site_url: https://sourcentis.github.io/pandora-box/

# Repository
repo_url: https://github.com/sourcentis/pandora-box
edit_uri: edit/main/docs

# Copyright
copyright: Copyright <a href="https://www.gnu.org/licenses/gpl-3.0.html">GPL-3.0</a>.

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.action.edit
    - content.action.view
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - css/overrides.css

extra:
  generator: false

plugins:
  - search
  # English pages are page.md, French pages page.fr.md
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            GETTING STARTED: DÉMARRAGE
            -- Hardware: -- Matériel
            INSTALLATION: INSTALLATION
            -- Building the image: -- Construction de l'image
            -- Releases: -- Versions publiées
            -- Testing with QEMU: -- Test avec QEMU
            -- Initial installation: -- Installation initiale
            MAINTENANCE: MAINTENANCE
            -- Signatures: -- Signatures
            -- System updates: -- Mises à jour du système
            -- Logs: -- Journaux
            -- Log export to a SIEM: -- Export vers un SIEM
            REFERENCE: RÉFÉRENCE
            -- Interface: -- Interface
            -- Configuration: -- Configuration
            -- Detection engines: -- Moteurs de détection
            -- Image internals: -- Fonctionnement de l'image
            DEVELOPMENT: DÉVELOPPEMENT
            -- Development: -- Développement

markdown_extensions:
  - attr_list
  - admonition
  # GitHub alerts (> [!WARNING]) rendered as admonitions: the pages read
  # the same on GitHub and on the documentation site
  - github-callouts
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight
  # The reference configuration is included from packaging/
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - GETTING STARTED:
      - Introduction: index.md
      - -- Hardware: hardware.md
  - INSTALLATION:
      - -- Building the image: build.md
      - -- Releases: release.md
      - -- Testing with QEMU: vm.md
      - -- Initial installation: install.md
  - MAINTENANCE:
      - -- Signatures: signatures.md
      - -- System updates: update.md
      - -- Logs: logs.md
      - -- Log export to a SIEM: siem.md
  - REFERENCE:
      - -- Interface: interface.md
      - -- Configuration: configuration.md
      - -- Detection engines: engines.md
      - -- Image internals: image.md
  - DEVELOPMENT:
      - -- Development: development.md
